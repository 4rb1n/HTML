<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HackLab v7 — Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --bg-2: #05070c;
    --panel: rgba(10, 14, 22, 0.75);
    --border: rgba(45, 212, 191, 0.15);
    --border-hi: rgba(45, 212, 191, 0.5);
    --text: #e6edf7;
    --dim: #4a5568;
    --green: #00ff9d;
    --cyan: #22d3ee;
    --purple: #a855f7;
    --pink: #ec4899;
    --yellow: #fbbf24;
    --red: #ff5f56;
    --accent: #00ff9d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ ANIMATED BACKGROUND LAYERS ============ */
  .bg-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* Matrix rain */
  #matrix {
    opacity: 0.12;
    z-index: 1;
  }

  /* Ambient gradient orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
    mix-blend-mode: screen;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, var(--green), transparent 70%);
    top: -200px; left: -200px;
    animation: orbFloat1 20s ease-in-out infinite;
  }
  .orb-2 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, var(--purple), transparent 70%);
    bottom: -300px; right: -250px;
    animation: orbFloat2 25s ease-in-out infinite;
  }
  .orb-3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, var(--cyan), transparent 70%);
    top: 40%; left: 50%;
    animation: orbFloat3 18s ease-in-out infinite;
  }

  @keyframes orbFloat1 {
    0%,100% { transform: translate(0, 0) scale(1); }
    50%     { transform: translate(200px, 150px) scale(1.2); }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0, 0) scale(1); }
    50%     { transform: translate(-250px, -180px) scale(1.15); }
  }
  @keyframes orbFloat3 {
    0%,100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
    50%     { transform: translate(-30%, -60%) scale(1.3); opacity: 0.5; }
  }

  /* Scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.02) 0px,
      rgba(255, 255, 255, 0.02) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  /* Animated scanline sweep */
  .sweep {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    overflow: hidden;
  }
  .sweep::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 100px;
    background: linear-gradient(180deg, transparent, rgba(0, 255, 157, 0.06), transparent);
    animation: sweepDown 8s linear infinite;
  }
  @keyframes sweepDown {
    0%   { top: -100px; }
    100% { top: 100%; }
  }

  /* Grid overlay */
  .grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(rgba(0, 255, 157, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridPulse 6s ease-in-out infinite;
  }
  @keyframes gridPulse {
    0%,100% { opacity: 0.3; }
    50%     { opacity: 0.6; }
  }

  /* ============ LAYOUT ============ */
  .app {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 1rem;
    gap: 0.8rem;
  }

  /* ============ TOP BAR ============ */
  .topbar {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.6rem 1rem;
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      0 0 40px rgba(0, 255, 157, 0.05);
    animation: slideDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .topbar::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), var(--cyan), var(--purple), transparent);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .dots { display: flex; gap: 0.45rem; }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
  }
  .dot.r { background: #ff5f56; box-shadow: 0 0 10px rgba(255, 95, 86, 0.6); }
  .dot.y { background: #ffbd2e; box-shadow: 0 0 10px rgba(255, 189, 46, 0.6); }
  .dot.g { background: #27c93f; box-shadow: 0 0 10px rgba(39, 201, 63, 0.6); }
  .dot:hover { transform: scale(1.25); }
  .dot.r:hover { box-shadow: 0 0 20px rgba(255, 95, 86, 1); }
  .dot.y:hover { box-shadow: 0 0 20px rgba(255, 189, 46, 1); }
  .dot.g:hover { box-shadow: 0 0 20px rgba(39, 201, 63, 1); }

  .term-title {
    font-size: 0.78rem;
    color: var(--dim);
    font-weight: 500;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .term-title .live {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--green);
    font-size: 0.68rem;
    padding: 0.1rem 0.5rem;
    border: 1px solid rgba(0, 255, 157, 0.35);
    border-radius: 100px;
    background: rgba(0, 255, 157, 0.08);
  }
  .term-title .live::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.4; transform: scale(0.8); }
  }

  .topbar-spacer { flex: 1; }

  .topbar-actions {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }

  .tb-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.35rem 0.7rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .tb-btn:hover {
    border-color: var(--green);
    color: var(--green);
    background: rgba(0, 255, 157, 0.08);
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0, 255, 157, 0.3);
  }
  .tb-btn:active { transform: translateY(0) scale(0.96); }

  .theme-dots { display: flex; gap: 0.35rem; }
  .theme-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .theme-dot:hover { transform: scale(1.15); }
  .theme-dot.active { border-color: white; transform: scale(1.15); }
  .theme-dot.kali     { background: linear-gradient(135deg, #00ff9d, #22d3ee); }
  .theme-dot.dracula  { background: linear-gradient(135deg, #50fa7b, #bd93f9); }
  .theme-dot.nord     { background: linear-gradient(135deg, #88c0d0, #a3be8c); }
  .theme-dot.matrix   { background: linear-gradient(135deg, #00ff41, #008822); }
  .theme-dot.cyberpunk{ background: linear-gradient(135deg, #f0db4f, #ff006e); }
  .theme-dot.sunset   { background: linear-gradient(135deg, #ff6b6b, #feca57); }

  /* ============ TERMINAL WRAPPER ============ */
  .term-wrap {
    flex: 1;
    position: relative;
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      0 0 60px rgba(0, 255, 157, 0.08);
    animation: termAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
  }
  @keyframes termAppear {
    from { opacity: 0; transform: scale(0.95) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Animated border glow */
  .term-wrap::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(135deg, var(--green), transparent 30%, transparent 70%, var(--purple));
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.5;
    animation: borderShift 5s linear infinite;
    background-size: 200% 200%;
    pointer-events: none;
    z-index: 20;
  }
  @keyframes borderShift {
    0%,100% { background-position: 0% 0%; }
    50%     { background-position: 100% 100%; }
  }

  /* Terminal body */
  .term {
    flex: 1;
    padding: 1.4rem 1.6rem;
    overflow-y: auto;
    font-size: 0.87rem;
    line-height: 1.65;
    scroll-behavior: smooth;
    position: relative;
  }
  .term::-webkit-scrollbar { width: 10px; }
  .term::-webkit-scrollbar-track { background: transparent; }
  .term::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--green), var(--purple));
    border-radius: 5px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .term::-webkit-scrollbar-thumb:hover { background: var(--green); background-clip: content-box; }

  .line {
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 2px;
    animation: lineIn 0.25s ease-out;
  }
  @keyframes lineIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Colors */
  .c-text   { color: var(--text); }
  .c-dim    { color: var(--dim); }
  .c-green  { color: var(--green); }
  .c-cyan   { color: var(--cyan); }
  .c-purple { color: var(--purple); }
  .c-pink   { color: var(--pink); }
  .c-yellow { color: var(--yellow); }
  .c-red    { color: var(--red); }
  .bold     { font-weight: 700; }

  /* Prompt */
  .p-user      { color: var(--green); font-weight: 600; }
  .p-host      { color: var(--cyan); font-weight: 600; }
  .p-path      { color: var(--purple); font-weight: 600; }
  .p-sym       { color: var(--dim); }
  .p-root-user { color: var(--red); font-weight: 700; }
  .p-root-sym  { color: var(--red); font-weight: 700; }

  /* ============ INPUT ============ */
  .input-line {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.9rem 1.6rem 1rem;
    background: rgba(0, 0, 0, 0.4);
    border-top: 1px solid var(--border);
    position: relative;
    flex-shrink: 0;
  }
  .input-line::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0.4;
  }
  .input-line .prompt {
    font-size: 0.87rem;
    white-space: nowrap;
    font-weight: 500;
  }

  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 0.87rem;
    caret-color: var(--green);
  }
  #cmd::placeholder { color: var(--dim); opacity: 0.5; }

  /* ============ AUTOCOMPLETE ============ */
  .autocomplete {
    position: absolute;
    bottom: 100%;
    left: 1.6rem;
    background: rgba(10, 14, 22, 0.98);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-hi);
    border-radius: 10px;
    padding: 0.5rem;
    display: none;
    flex-direction: column;
    gap: 0.15rem;
    min-width: 240px;
    max-height: 280px;
    overflow-y: auto;
    box-shadow:
      0 -15px 40px rgba(0, 0, 0, 0.7),
      0 0 30px rgba(0, 255, 157, 0.2);
    z-index: 100;
    margin-bottom: 0.4rem;
    animation: acIn 0.2s ease-out;
  }
  @keyframes acIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .autocomplete.show { display: flex; }
  .autocomplete .item {
    padding: 0.4rem 0.7rem;
    border-radius: 6px;
    font-size: 0.8rem;
    color: var(--text);
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .autocomplete .item::before {
    content: "▸";
    color: var(--dim);
    font-size: 0.75rem;
  }
  .autocomplete .item.active,
  .autocomplete .item:hover {
    background: linear-gradient(90deg, rgba(0, 255, 157, 0.15), rgba(168, 85, 247, 0.1));
    color: var(--green);
    transform: translateX(3px);
  }
  .autocomplete .item.active::before,
  .autocomplete .item:hover::before {
    color: var(--green);
  }

  /* ============ HINTS BAR ============ */
  .hints {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding: 0.5rem 1.6rem 0.8rem;
    background: rgba(0, 0, 0, 0.4);
    font-size: 0.68rem;
    color: var(--dim);
  }
  .hints span {
    padding: 0.2rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: rgba(0, 255, 157, 0.03);
    transition: all 0.2s;
    font-weight: 500;
  }
  .hints span:hover {
    border-color: var(--green);
    color: var(--green);
    background: rgba(0, 255, 157, 0.08);
  }

  /* ============ BOOT SCREEN ============ */
  #boot {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10000;
    padding: 3rem;
    font-size: 0.85rem;
    color: var(--green);
    overflow: hidden;
    line-height: 1.7;
    transition: opacity 0.6s;
    text-shadow: 0 0 8px rgba(0, 255, 157, 0.5);
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-cursor {
    display: inline-block;
    width: 9px; height: 1em;
    background: var(--green);
    vertical-align: text-bottom;
    animation: blink 0.8s steps(2) infinite;
    box-shadow: 0 0 8px var(--green);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ GLITCH EFFECT (on power) ============ */
  .glitch {
    animation: glitch 0.3s ease-out;
  }
  @keyframes glitch {
    0%,100% { transform: translate(0); filter: none; }
    20%     { transform: translate(-3px, 2px); filter: hue-rotate(90deg); }
    40%     { transform: translate(3px, -2px); filter: hue-rotate(-90deg); }
    60%     { transform: translate(-2px, -2px); filter: hue-rotate(45deg); }
    80%     { transform: translate(2px, 2px); filter: hue-rotate(-45deg); }
  }

  /* ============ EDITOR MODAL ============ */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    backdrop-filter: blur(8px);
    animation: modalIn 0.3s ease-out;
  }
  @keyframes modalIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .modal.show { display: flex; }
  .modal-box {
    background: rgba(10, 14, 22, 0.98);
    border: 1px solid var(--border-hi);
    border-radius: 14px;
    width: min(820px, 92vw);
    height: min(520px, 82vh);
    display: flex;
    flex-direction: column;
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), 0 0 60px rgba(0, 255, 157, 0.2);
    animation: modalBoxIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes modalBoxIn {
    from { transform: scale(0.9) translateY(30px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal-header {
    padding: 0.8rem 1.2rem;
    background: rgba(0, 0, 0, 0.5);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--dim);
  }
  .modal-body { flex: 1; padding: 1.2rem; overflow: hidden; }
  .modal-body textarea {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    resize: none;
    line-height: 1.6;
    caret-color: var(--green);
  }
  .modal-footer {
    padding: 0.6rem 1.2rem;
    background: rgba(0, 0, 0, 0.5);
    border-top: 1px solid var(--border);
    font-size: 0.7rem;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }

  /* ============ ACHIEVEMENT TOAST ============ */
  .achievement {
    position: fixed;
    bottom: 1.8rem;
    right: 1.8rem;
    background: rgba(10, 14, 22, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid var(--green);
    border-radius: 14px;
    padding: 1rem 1.2rem;
    box-shadow:
      0 25px 60px -10px rgba(0, 255, 157, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 0.9rem;
    transform: translateX(150%) rotate(5deg);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 5000;
    max-width: 340px;
  }
  .achievement.show { transform: translateX(0) rotate(0deg); }
  .achievement .icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--green), var(--purple));
    display: grid; place-items: center;
    font-size: 1.4rem;
    flex-shrink: 0;
    box-shadow: 0 0 25px rgba(0, 255, 157, 0.6);
    animation: iconBounce 0.6s ease-out;
  }
  @keyframes iconBounce {
    0%   { transform: scale(0) rotate(-180deg); }
    60%  { transform: scale(1.2) rotate(20deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .achievement h5 {
    font-size: 0.65rem;
    color: var(--green);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .achievement p {
    font-size: 0.88rem;
    font-weight: 600;
    margin-top: 0.2rem;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 700px) {
    .app { padding: 0.5rem; gap: 0.5rem; }
    .term { padding: 0.8rem; font-size: 0.78rem; }
    .input-line { padding: 0.6rem 0.8rem 0.7rem; }
    .input-line .prompt { font-size: 0.78rem; }
    #cmd { font-size: 0.78rem; }
    .hints { padding: 0.4rem 0.8rem; font-size: 0.6rem; }
    .topbar { padding: 0.5rem 0.7rem; gap: 0.5rem; }
    .term-title { font-size: 0.68rem; }
    .tb-btn span { display: none; }
    .orb { filter: blur(60px); }
  }
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div id="bootText"></div>
</div>

<!-- BACKGROUND LAYERS -->
<canvas id="matrix" class="bg-layer"></canvas>
<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="scanlines"></div>
<div class="sweep"></div>

<!-- ACHIEVEMENT -->
<div class="achievement" id="achievement">
  <div class="icon" id="achIcon">🏆</div>
  <div>
    <h5>Achievement Unlocked</h5>
    <p id="achText">Welcome, hacker.</p>
  </div>
</div>

<!-- EDITOR MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modalTitle">editor</span>
      <span>Ctrl+S save · Esc close</span>
    </div>
    <div class="modal-body">
      <textarea id="modalText" spellcheck="false"></textarea>
    </div>
    <div class="modal-footer">
      <span id="modalFile"></span>
      <span id="modalStatus">ready</span>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="dots">
      <div class="dot r" title="Close"></div>

function getFS() {
  const fs = {};

    const d = dirOf(f);
    if (!fs[d]) fs[d] = [];
    if (!fs[d].includes(baseOf(f))) fs[d].push(baseOf(f));
  }
  return fs;
}
function getFileContent(p) {
  if (state.customFiles[p] !== undefined) return state.customFiles[p];
  return BASE_FILES[p] || null;
}
function fileExists(p) { return getFileContent(p) !== null; }
function dirExists(p) { return !!getFS()[p]; }
function dirOf(p) { return p.substring(0, p.lastIndexOf('/')) || '/'; }
function baseOf(p) { return p.substring(p.lastIndexOf('/') + 1); }

  const sym = state.isRoot ? '#' : '$';
  return `<span class="${u}">${state.user}</span><span class="${s}">@</span><span class="p-host">${state.host}</span><span class="${s}">:</span><span class="p-path">${p}</span><span class="${s}">${sym}</span>`;
}

function resolvePath(p, base = state.cwd) {
  if (!p || p === '~') return '/home/' + state.user;
  if (p.startsWith('~/')) return '/home/' + state.user + p.slice(1);
  if (p.startsWith('/')) return norm(p);
  return norm(base + '/' + p);
}
function norm(p) {
  const parts = p.split('/');
  const out = [];
  for (const part of parts) {
    if (!part || part === '.') continue;
    if (part === '..') out.pop();
    else out.push(part);
  }
  return '/' + out.join('/');
}

function beep(freq = 800, dur = 0.04, type = 'square', vol = 0.03) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch {}
}

(function matrix() {
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let w, h, cols, drops;
  function resize() {
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
    cols = Math.floor(w / 16);
    drops = Array(cols).fill(1);
  }
  resize();
  addEventListener('resize', resize);
  const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノ$#@%&*+=<>{}[]()";
  function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.06)";
    ctx.fillRect(0, 0, w, h);
    const t = themes[state.theme] || themes.kali;
    ctx.fillStyle = t.green;
    ctx.font = "14px JetBrains Mono, monospace";
    for (let i = 0; i < drops.length; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * 16, drops[i] * 16);
      if (drops[i] * 16 > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 55);
})();

C.ls = (a) => {
  const long = a.includes('-l') || a.includes('-la') || a.includes('-al');
  const showAll = a.includes('-a') || long;
  const path = resolvePath(a.find(x => !x.startsWith('-')) || state.cwd);
  const fs = getFS();
  if (!fs[path]) { writeText(`ls: cannot access '${path}': No such file or directory`, 'c-red'); return; }
  let items = [...fs[path]];
  if (!showAll) items = items.filter(f => !f.startsWith('.'));
  items.sort();
  if (!items.length) return;
  if (long) {
    items.forEach(f => {
      const full = (path === '/' ? '' : path) + '/' + f;
      const isDir = !!fs[full];
      const perm = isDir ? 'drwxr-xr-x' : '-rw-r--r--';
      const size = isDir ? 4096 : (getFileContent(full)?.length || 0);
      const colored = isDir ? `<span class="c-cyan bold">${esc(f)}</span>`
        : f.match(/\.(sh|py)$/) ? `<span class="c-green">${esc(f)}</span>`
        : f.match(/\.(txt|md)$/) ? `<span class="c-yellow">${esc(f)}</span>` : esc(f);
      write(`${perm}  ${String(size).padStart(6)}  kali kali  ${colored}`);
    });
  } else {
    write(items.map(f => {
      const full = (path === '/' ? '' : path) + '/' + f;
      if (fs[full]) return `<span class="c-cyan bold">${esc(f)}</span>`;
      if (f.match(/\.(sh|py)$/)) return `<span class="c-green">${esc(f)}</span>`;
      if (f.match(/\.(txt|md)$/)) return `<span class="c-yellow">${esc(f)}</span>`;
      if (f.match(/\.(gz|zip)$/)) return `<span class="c-yellow">${esc(f)}</span>`;
      return esc(f);
    }).join('   '));
  }
};

C.tree = (a) => {
  const start = resolvePath(a.find(x => !x.startsWith('-')) || state.cwd);
  const fs = getFS();
  if (!fs[start]) { writeText(`tree: ${start}: No such directory`, 'c-red'); return; }
  write(`<span class="c-cyan bold">${esc(start)}</span>`);
  let dc = 0, fc = 0;
  (function walk(path, prefix = '') {
    if (!fs[path]) return;
    const items = [...fs[path]].sort();
    items.forEach((item, i) => {
      const full = (path === '/' ? '' : path) + '/' + item;
      const isDir = !!fs[full];
      const last = i === items.length - 1;
      const branch = last ? '└── ' : '├── ';
      if (isDir) { dc++; write(prefix + branch + `<span class="c-cyan bold">${esc(item)}</span>`); walk(full, prefix + (last ? '    ' : '│   ')); }
      else { fc++; write(prefix + branch + esc(item)); }
    });
  })(start);
  write('');
  write(`<span class="c-dim">${dc} directories, ${fc} files</span>`);
};

function openEditor(path, mode) {
  const existing = getFileContent(path) || '';
  modal.classList.add('show');
  modalTitle.textContent = (mode === 'vim' ? 'VIM' : 'nano') + ' — ' + path;
  modalFile.textContent = path;
  modalText.value = existing;
  modalText.focus();
  const save = () => {
    state.customFiles[path] = modalText.value;
    saveState();
    modalStatus.textContent = '✔ saved';
  };
  const close = () => {
    modal.classList.remove('show');
    document.removeEventListener('keydown', keyHandler);
    write(`<span class="c-dim">(${mode === 'vim' ? ':wq' : 'Ctrl+O'} — saved to ${esc(path)})</span>`);
  };
  const keyHandler = (e) => {
    if (e.key === 'Escape') close();
    if (e.ctrlKey && e.key === 's') { e.preventDefault(); save(); }
  };
  document.addEventListener('keydown', keyHandler);
}

/* ============================================================
   RUN
   ============================================================ */
function run(raw) {
  const trimmed = raw.trim();
  if (!trimmed) { write(promptStr() + ' '); return; }
  state.history.push(trimmed);
  state.cmdCount++;
  saveState();
  write(promptStr() + ' ' + esc(trimmed));
  beep(500 + Math.random() * 400, 0.02, 'square', 0.02);

  if (state.cmdCount === 1) unlock('firstCmd');
  if (state.cmdCount === 10) unlock('cmd10');
  if (state.cmdCount === 25) unlock('cmd25');

  const parts = trimmed.split(/\s+/);
  let cmd = parts[0].toLowerCase();
  let args = parts.slice(1);

  if (state.alias[cmd]) {
    const ex = state.alias[cmd].split(/\s+/);
    cmd = ex[0]; args = [...ex.slice(1), ...args];
  }
  if (cmd === 'help') unlock('helpUser');

  if (C[cmd]) {
    try { C[cmd](args); } catch (e) { write(`<span class="c-red">error: ${esc(e.message)}</span>`); }
  } else {
    write(`<span class="c-red">${esc(cmd)}: command not found.</span> <span class="c-dim">Type 'help'.</span>`);
    const sims = Object.keys(C).filter(k => k.startsWith(cmd[0])).slice(0, 4);
    if (sims.length) write(`<span class="c-dim">Did you mean: ${sims.join(', ')}?</span>`);
  }
}

/* ============================================================
   INPUT
   ============================================================ */
let autocompleteMatches = [];
let autocompleteIdx = 0;

function showAutocomplete(matches) {
  if (!matches.length) return hideAutocomplete();
  autocompleteMatches = matches;
  autocompleteIdx = 0;
  autocompleteEl.innerHTML = matches.map((m, i) =>
    `<div class="item${i === 0 ? ' active' : ''}" data-idx="${i}">${esc(m)}</div>`
  ).join('');
  autocompleteEl.classList.add('show');
  autocompleteEl.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => applyCompletion(matches[+el.dataset.idx]));
  });
}
function hideAutocomplete() {
  autocompleteEl.classList.remove('show');
  autocompleteMatches = [];
}
function applyCompletion(c) {
  const v = input.value;
  const parts = v.split(' ');
  if (parts.length === 1) input.value = c + ' ';
  else { parts[parts.length - 1] = c; input.value = parts.join(' '); }
  hideAutocomplete();
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = input.value;
    input.value = '';
    hideAutocomplete();
    run(v);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (autocompleteMatches.length) {
      autocompleteIdx = Math.max(0, autocompleteIdx - 1);
      autocompleteEl.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('active', i === autocompleteIdx));
      return;
    }
    if (historyIdx > 0) { historyIdx--; input.value = state.history[historyIdx] || ''; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (autocompleteMatches.length) {
      autocompleteIdx = Math.min(autocompleteMatches.length - 1, autocompleteIdx + 1);
      autocompleteEl.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('active', i === autocompleteIdx));
      return;
    }
    if (historyIdx < state.history.length - 1) { historyIdx++; input.value = state.history[historyIdx] || ''; }
    else { historyIdx = state.history.length; input.value = ''; }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const v = input.value;
    const parts = v.split(' ');
    const last = parts[parts.length - 1] || '';
    let matches = [];
    if (parts.length === 1) matches = Object.keys(C).filter(c => c.startsWith(last)).sort();
    else matches = (getFS()[state.cwd] || []).filter(f => f.startsWith(last)).sort();
    if (matches.length === 1) applyCompletion(matches[0]);
    else if (matches.length > 1) {
      let lcp = matches[0];
      for (const m of matches) {
        let i = 0;
        while (i < lcp.length && i < m.length && lcp[i] === m[i]) i++;
        lcp = lcp.slice(0, i);
      }
      if (lcp.length > last.length) applyCompletion(lcp);
      else showAutocomplete(matches);
    }
  } else if (e.key === 'Escape') hideAutocomplete();
  else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); term.innerHTML = ''; }
  else if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault();
    write(promptStr() + ' ' + esc(input.value) + '<span class="c-red">^C</span>');
    input.value = '';
  }
});

let historyIdx = state.history.length;

input.addEventListener('input', () => {
  const v = input.value;
  const parts = v.split(' ');
  const last = parts[parts.length - 1] || '';
  if (!last) return hideAutocomplete();
  let matches = [];
  if (parts.length === 1) matches = Object.keys(C).filter(c => c.startsWith(last)).slice(0, 8);
  else matches = (getFS()[state.cwd] || []).filter(f => f.startsWith(last)).slice(0, 8);
  if (matches.length > 1) showAutocomplete(matches);
  else hideAutocomplete();
});

document.body.addEventListener('click', () => input.focus());
