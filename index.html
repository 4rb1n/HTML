<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HackLab v5 — Linux Terminal Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --bg-2: #060910;
    --panel: #0d1319;
    --border: #1a2332;
    --text: #c9d1d9;
    --dim: #6e7681;
    --green: #7ee787;
    --cyan: #79c0ff;
    --yellow: #ffd866;
    --red: #ff7b72;
    --purple: #d2a8ff;
    --orange: #ffa657;
    --pink: #f778ba;
    --accent: #58a6ff;
  }

  /* ===== THEMES ===== */
  body.theme-dracula {
    --bg: #282a36; --bg-2: #21222c; --panel: #282a36;
    --border: #44475a; --text: #f8f8f2; --dim: #6272a4;
    --green: #50fa7b; --cyan: #8be9fd; --yellow: #f1fa8c;
    --red: #ff5555; --purple: #bd93f9; --orange: #ffb86c;
    --pink: #ff79c6; --accent: #bd93f9;
  }
  body.theme-nord {
    --bg: #2e3440; --bg-2: #272c36; --panel: #2e3440;
    --border: #434c5e; --text: #eceff4; --dim: #7b88a1;
    --green: #a3be8c; --cyan: #88c0d0; --yellow: #ebcb8b;
    --red: #bf616a; --purple: #b48ead; --orange: #d08770;
    --pink: #b48ead; --accent: #88c0d0;
  }
  body.theme-solarized {
    --bg: #002b36; --bg-2: #00212b; --panel: #073642;
    --border: #0f4c5c; --text: #93a1a1; --dim: #586e75;
    --green: #859900; --cyan: #2aa198; --yellow: #b58900;
    --red: #dc322f; --purple: #6c71c4; --orange: #cb4b16;
    --pink: #d33682; --accent: #268bd2;
  }
  body.theme-matrix {
    --bg: #000000; --bg-2: #000000; --panel: #0a0a0a;
    --border: #003300; --text: #00ff41; --dim: #008822;
    --green: #00ff41; --cyan: #00ff88; --yellow: #88ff00;
    --red: #ff0000; --purple: #00ffaa; --orange: #88ff00;
    --pink: #00ff41; --accent: #00ff41;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ===== TITLE BAR ===== */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    user-select: none;
    flex-shrink: 0;
  }

  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f56; }
  .dot.y { background: #ffbd2e; }
  .dot.g { background: #27c93f; }

  .title {
    flex: 1;
    text-align: center;
    color: var(--dim);
    font-size: 0.75rem;
    font-weight: 500;
  }

  .titlebar-actions {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }

  .tb-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.2rem 0.55rem;
    border-radius: 5px;
    font-family: inherit;
    font-size: 0.68rem;
    cursor: pointer;
    transition: 0.15s;
  }
  .tb-btn:hover { border-color: var(--accent); color: var(--accent); }

  select.tb-btn { padding: 0.2rem 0.4rem; }

  /* ===== TERMINAL ===== */
  .term-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    position: relative;
  }

  .term-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.015) 0px,
      rgba(255, 255, 255, 0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 5;
  }

  .term {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.2rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    scroll-behavior: smooth;
    font-size: 0.88rem;
    position: relative;
    z-index: 6;
  }

  .term::-webkit-scrollbar { width: 10px; }
  .term::-webkit-scrollbar-track { background: var(--bg); }
  .term::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .term::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .line { white-space: pre-wrap; word-break: break-word; margin-bottom: 1px; }

  /* Colors */
  .c-text   { color: var(--text); }
  .c-dim    { color: var(--dim); }
  .c-green  { color: var(--green); }
  .c-cyan   { color: var(--cyan); }
  .c-yellow { color: var(--yellow); }
  .c-red    { color: var(--red); }
  .c-purple { color: var(--purple); }
  .c-orange { color: var(--orange); }
  .c-pink   { color: var(--pink); }
  .c-accent { color: var(--accent); }
  .bold { font-weight: 700; }

  /* Prompt colors */
  .p-user { color: var(--green); }
  .p-host { color: var(--cyan); }
  .p-path { color: var(--purple); }
  .p-sym  { color: var(--dim); }
  .p-root-user { color: var(--red); font-weight: 700; }
  .p-root-sym  { color: var(--red); font-weight: 700; }

  /* Input line */
  .input-line {
    display: flex;
    align-items: center;
    padding: 0.5rem 1.2rem 0.8rem;
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
    position: relative;
  }

  .input-line .prompt {
    margin-right: 0.5rem;
    white-space: nowrap;
    font-size: 0.88rem;
    font-weight: 500;
  }

  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 0.88rem;
    caret-color: var(--green);
  }

  #cmd::placeholder { color: var(--dim); opacity: 0.5; }

  /* ===== ASCII banner ===== */
  .ascii {
    color: var(--green);
    font-size: 0.65rem;
    line-height: 1.05;
    font-weight: 500;
  }

  /* ===== Autocomplete dropdown ===== */
  .autocomplete {
    position: absolute;
    bottom: 100%;
    left: 1.2rem;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 0.4rem;
    display: none;
    flex-direction: column;
    gap: 0.15rem;
    min-width: 200px;
    max-height: 240px;
    overflow-y: auto;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
    z-index: 100;
  }

  .autocomplete.show { display: flex; }

  .autocomplete .item {
    padding: 0.3rem 0.6rem;
    border-radius: 5px;
    font-size: 0.82rem;
    color: var(--text);
    cursor: pointer;
  }
  .autocomplete .item.active,
  .autocomplete .item:hover {
    background: var(--accent);
    color: var(--bg);
  }

  /* ===== Status bar ===== */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.35rem 1rem;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--dim);
    flex-shrink: 0;
  }

  .statusbar .left, .statusbar .right {
    display: flex;
    gap: 1rem;
    align-items: center;
  }

  .statusbar .pill {
    padding: 0.1rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .statusbar .pill.live { color: var(--green); border-color: var(--green); }
  .statusbar .pill.warn { color: var(--yellow); border-color: var(--yellow); }

  .cursor-blink {
    display: inline-block;
    width: 8px; height: 1em;
    background: var(--green);
    vertical-align: text-bottom;
    animation: blink 1s steps(2) infinite;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== Modal (vim, nano, etc.) ===== */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    backdrop-filter: blur(5px);
  }
  .modal.show { display: flex; }

  .modal-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: min(800px, 90vw);
    height: min(500px, 80vh);
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
  }

  .modal-header {
    padding: 0.7rem 1rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--dim);
  }

  .modal-body {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
  }

  .modal-body textarea {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 0.88rem;
    resize: none;
    line-height: 1.5;
  }

  .modal-footer {
    padding: 0.5rem 1rem;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }

  /* ===== Mobile ===== */
  @media (max-width: 700px) {
    .term { font-size: 0.78rem; padding: 0.7rem; }
    #cmd { font-size: 0.78rem; }
    .input-line .prompt { font-size: 0.78rem; }
    .title { font-size: 0.65rem; }
    .titlebar-actions .tb-btn span { display: none; }
  }
</style>
</head>

  cwd: '/home/kali',

let state = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem('hacklab_v5_state');
    if (raw) return { ...DEFAULT_STATE, ...JSON.parse(raw) };
  } catch {}
  return { ...DEFAULT_STATE };
}
function saveState() {
  try { localStorage.setItem('hacklab_v5_state', JSON.stringify(state)); } catch {}
}

/* ============================================================
   FILESYSTEM — merges base + user-created
   ============================================================ */
function getFS() {
  const fs = {};
  for (const [k, v] of Object.entries(BASE_FS)) fs[k] = [...v];
  // add custom dirs
  for (const d of Object.keys(state.customDirs)) {
    if (!fs[d]) fs[d] = [];
  }
  // add custom files to their dirs
  for (const f of Object.keys(state.customFiles)) {
    const dir = dirOf(f);
    if (!fs[dir]) fs[dir] = [];
    if (!fs[dir].includes(baseOf(f))) fs[dir].push(baseOf(f));
  }
  return fs;
}

function getFileContent(path) {
  if (state.customFiles[path] !== undefined) return state.customFiles[path];
  return BASE_FILE_CONTENT[path] || null;
}
function fileExists(path) { return getFileContent(path) !== null; }
function dirExists(path) {
  const fs = getFS();
  return !!fs[path];
}
function isDir(path) { return dirExists(path); }
function isFile(path) { return fileExists(path) && !dirExists(path); }
function dirOf(p) { return p.substring(0, p.lastIndexOf('/')) || '/'; }
function baseOf(p) { return p.substring(p.lastIndexOf('/') + 1); }

function escape(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function write(html) {
  const line = document.createElement('div');
  line.className = 'line';
  line.innerHTML = html;
  term.appendChild(line);
  term.scrollTop = term.scrollHeight;
}
function writeText(text, cls = 'c-text') { write(`<span class="${cls}">${escape(text)}</span>`); }
function writeRaw(html) { write(html); }
function colorize(text, cls) { return `<span class="${cls}">${escape(text)}</span>`; }

function promptStr() {
  const p = state.cwd === '/home/' + state.user
    ? '~'
    : state.cwd.startsWith('/home/' + state.user + '/')
      ? '~' + state.cwd.slice(('/home/' + state.user).length)
      : state.cwd;
  const userCls = state.isRoot ? 'p-root-user' : 'p-user';
  const symCls = state.isRoot ? 'p-root-sym' : 'p-sym';
  const sym = state.isRoot ? '#' : '$';
  return `<span class="${userCls}">${state.user}</span><span class="${symCls}">@</span><span class="p-host">${state.host}</span><span class="${symCls}">:</span><span class="p-path">${p}</span><span class="${symCls}">${sym}</span>`;
}
function updatePrompt() {
  promptEl.innerHTML = promptStr();
  sbUser.textContent = state.user + '@' + state.host;

  document.body.className = 'theme-' + state.theme;
}
function updateCmdCount() { sbCmds.textContent = state.cmdCount + ' cmds'; }

function resolvePath(p, base = state.cwd) {
  if (!p || p === '~') return '/home/' + state.user;
  if (p.startsWith('~/')) return '/home/' + state.user + p.slice(1);
  if (p.startsWith('/')) return normalize(p);
  return normalize(base + '/' + p);
}
function normalize(p) {
  const parts = p.split('/');
  const out = [];
  for (const part of parts) {
    if (!part || part === '.') continue;
    if (part === '..') out.pop();
    else out.push(part);
  }
  return '/' + out.join('/');
}

let audioCtx;
function beep(freq = 800, dur = 0.04, type = 'square', vol = 0.03) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch {}
}

  const val = input.value;
  const parts = val.split(' ');
  if (parts.length === 1) input.value = choice + ' ';
  else { parts[parts.length - 1] = choice; input.value = parts.join(' '); }
  hideAutocomplete();
}

C.ls = (args) => {
  const showAll = args.includes('-a') || args.includes('-la') || args.includes('-al') || args.includes('-l');
  const long = args.includes('-l') || args.includes('-la') || args.includes('-al');
  const path = resolvePath(args.find(a => !a.startsWith('-')) || state.cwd);
  const fs = getFS();
  if (!fs[path]) {
    writeText(`ls: cannot access '${path}': No such file or directory`, 'c-red');
    return;
  }
  let items = [...fs[path]];
  if (!showAll) items = items.filter(f => !f.startsWith('.'));
  items.sort();
  if (items.length === 0) return;
  if (long) {
    items.forEach(f => {
      const full = (path === '/' ? '' : path) + '/' + f;
      const isDir = !!fs[full];
      const perm = isDir ? 'drwxr-xr-x' : '-rw-r--r--';
      const size = isDir ? 4096 : (getFileContent(full)?.length || 0);
      const owner = isDir ? 'kali kali' : 'kali kali';
      const colored = isDir
        ? `<span class="c-cyan bold">${escape(f)}</span>`
        : f.endsWith('.sh') || f.endsWith('.py')
          ? `<span class="c-green">${escape(f)}</span>`
          : f.endsWith('.txt') || f.endsWith('.md')
            ? `<span class="c-yellow">${escape(f)}</span>`
            : escape(f);
      writeRaw(`${perm}  ${String(size).padStart(6)}  ${owner}  ${colored}`);
    });
  } else {
    const out = items.map(f => {
      const full = (path === '/' ? '' : path) + '/' + f;
      if (fs[full]) return `<span class="c-cyan bold">${escape(f)}</span>`;
      if (f.endsWith('.sh') || f.endsWith('.py')) return `<span class="c-green">${escape(f)}</span>`;
      if (f.endsWith('.txt') || f.endsWith('.md')) return `<span class="c-yellow">${escape(f)}</span>`;
      if (f.endsWith('.gz') || f.endsWith('.zip')) return `<span class="c-orange">${escape(f)}</span>`;
      return escape(f);
    });
    writeRaw(out.join('   '));
  }
};

C.tree = (args) => {
  const start = resolvePath(args.find(a => !a.startsWith('-')) || state.cwd);
  const fs = getFS();
  if (!fs[start]) { writeText(`tree: ${start}: No such directory`, 'c-red'); return; }
  writeRaw(`<span class="c-cyan bold">${escape(start)}</span>`);
  let dirCount = 0, fileCount = 0;
  (function walk(path, prefix = '') {
    if (!fs[path]) return;
    const items = [...fs[path]].sort();
    items.forEach((item, i) => {
      const full = (path === '/' ? '' : path) + '/' + item;
      const isDir = !!fs[full];
      const last = i === items.length - 1;
      const branch = last ? '└── ' : '├── ';
      if (isDir) {
        dirCount++;
        writeRaw(prefix + branch + `<span class="c-cyan bold">${escape(item)}</span>`);
        walk(full, prefix + (last ? '    ' : '│   '));
      } else {
        fileCount++;
        writeRaw(prefix + branch + escape(item));
      }
    });
  })(start);
  writeRaw(``);
  writeRaw(`<span class="c-dim">${dirCount} directories, ${fileCount} files</span>`);
};

C.apt = (args) => {

    writeRaw(`Reading package lists... Done`);
    writeRaw(`<span class="c-green">All packages are up to date.</span>`);
  } else if (sub === 'install') {
    const pkg = args[1];
    if (!pkg) { writeText('apt: missing package name', 'c-red'); return; }
    if (state.installedPackages.includes(pkg)) { writeRaw(`<span class="c-yellow">${escape(pkg)} is already the newest version.</span>`); return; }
    state.installedPackages.push(pkg);
    saveState();
    writeRaw(`Reading package lists... Done`);
    writeRaw(`Building dependency tree... Done`);
    writeRaw(`The following NEW packages will be installed:`);
    writeRaw(`  ${escape(pkg)}`);
    writeRaw(`0 upgraded, 1 newly installed, 0 to remove.`);
    writeRaw(`<span class="c-green">Setting up ${escape(pkg)} ...</span>`);
    writeRaw(`<span class="c-green">✔ ${escape(pkg)} installed.</span>`);
  } else if (sub === 'remove' || sub === 'purge') {
    const pkg = args[1];
    const idx = state.installedPackages.indexOf(pkg);
    if (idx > -1) { state.installedPackages.splice(idx, 1); saveState(); }
    writeRaw(`Removing ${escape(pkg)} ...`);
    writeRaw(`<span class="c-green">✔ Done.</span>`);
  } else if (sub === 'search') {
    const q = args[1] || '';
    writeRaw(`Sorting... Done`);
    writeRaw(`Full Text Search... Done`);
    writeRaw(`<span class="c-yellow">${escape(q)}-tools/kali-rolling 1.0 amd64</span>`);
    writeRaw(`  Simulated search result for "${escape(q)}"`);
  } else if (sub === 'list') {
    writeRaw(`Listing... Done`);
    state.installedPackages.forEach(p => writeRaw(`${p}/kali-rolling,now 1.0 amd64 [installed]`));
  } else {
    writeText(`apt: unknown subcommand '${sub}'`, 'c-red');
  }
};

/* ---------- Editing (modal) ---------- */
function openEditor(path, mode) {
  const existing = getFileContent(path) || '';
  modal.classList.add('show');
  modalTitle.textContent = (mode === 'vim' ? 'VIM' : 'GNU nano') + ' — ' + path;
  modalFile.textContent = path;
  modalText.value = existing;
  modalText.focus();
  const save = () => {
    state.customFiles[path] = modalText.value;
    saveState();
    document.getElementById('modalStatus').textContent = '✔ saved';
  };
  const close = () => {
    modal.classList.remove('show');
    modal.removeEventListener('keydown', keyHandler);
    writeRaw(`<span class="c-dim">(${mode === 'vim' ? ':wq' : 'Ctrl+O'} — saved to ${escape(path)})</span>`);
  };
  const keyHandler = (e) => {
    if (e.key === 'Escape') close();
    if (e.ctrlKey && e.key === 's') { e.preventDefault(); save(); }
  };
  document.addEventListener('keydown', keyHandler);
}

/* ============================================================
   COMMAND RUNNER
   ============================================================ */
function run(raw) {
  const trimmed = raw.trim();
  if (!trimmed) { writeRaw(promptStr() + ' '); return; }

  state.history.push(trimmed);
  state.cmdCount++;
  updateCmdCount();
  saveState();

  writeRaw(promptStr() + ' ' + escape(trimmed));
  beep(500 + Math.random() * 400, 0.02, 'square', 0.02);

  // Aliases
  const parts = trimmed.split(/\s+/);
  let cmd = parts[0].toLowerCase();
  let args = parts.slice(1);

  if (state.alias[cmd]) {
    const expanded = state.alias[cmd].split(/\s+/);
    cmd = expanded[0];
    args = [...expanded.slice(1), ...args];
  }

  if (C[cmd]) {
    try { C[cmd](args); } catch (e) { writeRaw(`<span class="c-red">error: ${escape(e.message)}</span>`); }
  } else {
    writeRaw(`<span class="c-red">${escape(cmd)}: command not found.</span> <span class="c-dim">Type 'help' for available commands.</span>`);
    // Suggest similar
    const sims = Object.keys(C).filter(k => k.startsWith(cmd[0])).slice(0, 4);
    if (sims.length) writeRaw(`<span class="c-dim">Did you mean: ${sims.join(', ')}?</span>`);
  }
}

/* ============================================================
   INPUT EVENTS
   ============================================================ */
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = input.value;
    input.value = '';
    hideAutocomplete();
    run(v);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (autocompleteMatches.length) {
      autocompleteIdx = Math.max(0, autocompleteIdx - 1);
      autocompleteEl.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('active', i === autocompleteIdx));
      return;
    }
    if (historyIdx > 0) { historyIdx--; input.value = state.history[historyIdx] || ''; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (autocompleteMatches.length) {
      autocompleteIdx = Math.min(autocompleteMatches.length - 1, autocompleteIdx + 1);
      autocompleteEl.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('active', i === autocompleteIdx));
      return;
    }
    if (historyIdx < state.history.length - 1) { historyIdx++; input.value = state.history[historyIdx] || ''; }
    else { historyIdx = state.history.length; input.value = ''; }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value;
    const parts = val.split(' ');
    const last = parts[parts.length - 1] || '';
    let matches = [];
    if (parts.length === 1) {
      matches = Object.keys(C).filter(c => c.startsWith(last)).sort();
    } else {
      const fs = getFS();
      matches = (fs[state.cwd] || []).filter(f => f.startsWith(last)).sort();
    }
    if (matches.length === 1) {
      applyCompletion(matches[0]);
    } else if (matches.length > 1) {
      // find longest common prefix
      let lcp = matches[0];
      for (const m of matches) {
        let i = 0;
        while (i < lcp.length && i < m.length && lcp[i] === m[i]) i++;
        lcp = lcp.slice(0, i);
      }
      if (lcp.length > last.length) {
        applyCompletion(lcp);
      } else {
        showAutocomplete(matches, last);
      }
    }
  } else if (e.key === 'Escape') {
    hideAutocomplete();
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    term.innerHTML = '';
  } else if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault();
    writeRaw(promptStr() + ' ' + escape(input.value) + '<span class="c-red">^C</span>');
    input.value = '';
  }
});

input.addEventListener('input', () => {
  const val = input.value;
  const parts = val.split(' ');
  const last = parts[parts.length - 1] || '';
  if (!last) { hideAutocomplete(); return; }
  let matches = [];
  if (parts.length === 1) {
    matches = Object.keys(C).filter(c => c.startsWith(last)).slice(0, 8);
  } else {
    const fs = getFS();
    matches = (fs[state.cwd] || []).filter(f => f.startsWith(last)).slice(0, 8);
  }
  if (matches.length > 1) showAutocomplete(matches, last);
  else hideAutocomplete();
});
